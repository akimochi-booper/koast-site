<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="koast-preview-version" content="coastal-light-studies-20261029-v3"><title>Koast Driver · Coastal light studies</title><link rel="canonical" href="https://koastride.com/preview/driver-cinematic/coastal/lights/"><meta name="description" content="Three brighter light treatments for the Coastal Afterglow Koast Driver splash concept."><script src="/koast-acquisition.js?v=2" defer></script><style>*{box-sizing:border-box}html{background:#0b0d10;color:#eef4f1;font:15px system-ui,-apple-system,sans-serif}body{margin:0;padding:18px 14px calc(12px + env(safe-area-inset-bottom));min-height:100svh}header{text-align:center;max-width:620px;margin:auto}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#70cbbd}h1{font-size:20px;font-weight:550;margin:7px 0 14px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}button{font:inherit;touch-action:manipulation;cursor:pointer;border:1px solid #35564b;border-radius:8px;padding:9px 13px;background:#12261f;color:#bedbcd;font-size:13px}.tab{min-height:42px;padding:9px 3px;font-size:12px}.tab[aria-selected=true]{background:#1b4b3d;border-color:#6cbea4;color:#effff7}button:focus-visible,a:focus-visible{outline:2px solid #8ae3cb;outline-offset:3px}.frame{position:relative;overflow:hidden;width:min(100%,calc((100svh - 260px)*390/844));min-width:190px;aspect-ratio:390/844;margin:10px auto}.scene{position:absolute;width:390px;height:844px;transform-origin:0 0}.scene>svg{display:block}.controls{display:flex;justify-content:center;gap:8px;margin:9px auto}.status{text-align:center;font-size:12px;line-height:1.5;color:#b5c9be;min-height:32px;margin:0 auto 5px;max-width:600px}.links{font-size:11px;text-align:center;color:#81988a}a{color:#a2daca;text-underline-offset:3px}.note{font-size:10px;color:#7d9389;text-align:center;margin-top:9px}@media(min-width:850px){.frame{width:min(390px,calc((100svh - 260px)*390/844))}}</style></head><body><header><div class="eyebrow">EXPLORATORY · THREE LIGHT TREATMENTS</div><h1>Coastal Afterglow</h1><div class="tabs" role="tablist" aria-label="Moving light options"><button class="tab" id="tab-0" data-index="0" role="tab" aria-selected="true" aria-controls="frame" tabindex="0">1 · Bright Glint</button><button class="tab" id="tab-1" data-index="1" role="tab" aria-selected="false" aria-controls="frame" tabindex="-1">2 · Headlights</button><button class="tab" id="tab-2" data-index="2" role="tab" aria-selected="false" aria-controls="frame" tabindex="-1">3 · Light Sweep</button></div></header><main><div class="frame" id="frame" role="tabpanel" aria-labelledby="tab-0"><div class="scene" id="scene"></div></div><p class="status" id="status" aria-live="polite">Loading animation…</p><div class="controls"><button id="play">Play animation</button><button id="pause" disabled>Pause</button></div><div class="links"><a id="gif" href="/preview/driver-cinematic/coastal/lights/glint.gif">Open animated GIF</a> · <a href="/preview/driver-cinematic/coastal/?v=2">Previous comparison</a></div><div class="note">Same scene and timing · Driver app unchanged</div></main><script type="module">
import {sample,stageMarkup,bindScene,duration,descriptions,filenames} from '../motion-v3.mjs';
const $=id=>document.getElementById(id),scene=$('scene'),reduced=matchMedia('(prefers-reduced-motion: reduce)');const query=Number(new URLSearchParams(location.search).get('style'));let style=[1,2,3].includes(query)?query-1:0,ready=false,render,raf=0,epoch=0,held=0,paused=true,manual=false,serial=0;
function fit(){scene.style.transform='scale('+($('frame').clientWidth/390)+')'}new ResizeObserver(fit).observe($('frame'));fit();
function draw(t,still=false){if(render)render(sample(style,t,still),style)}
function tick(now){if(!paused)draw((now-epoch)%duration);if(!paused&&!document.hidden)raf=requestAnimationFrame(tick)}
function still(){cancelAnimationFrame(raf);paused=true;held=2200;draw(2200,true);$('pause').disabled=true;$('play').textContent='Play animation';$('status').textContent='Motion is paused by your device setting. Tap Play animation to preview.'}
function play(explicit=true){if(!ready){load();return;}manual=explicit;cancelAnimationFrame(raf);epoch=performance.now();paused=false;held=0;draw(0);$('pause').disabled=false;$('pause').textContent='Pause';$('play').textContent='Replay';$('status').textContent=descriptions[style];raf=requestAnimationFrame(tick)}
function image(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=url})}
function select(index){style=index;for(const tab of document.querySelectorAll('.tab')){const active=Number(tab.dataset.index)===style;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1}$('frame').setAttribute('aria-labelledby','tab-'+style);$('gif').href=filenames[style];if(ready){if(reduced.matches&&!manual)still();else{draw(paused?held:(performance.now()-epoch)%duration);$('status').textContent=descriptions[style];}}}
async function load(){const ticket=++serial;$('status').textContent='Loading animation…';try{await Promise.all(['../../assets/coastal.jpg','../../wordmark.svg','../../assets/lightpoint.png'].map(image));if(ticket!==serial)return;scene.innerHTML=stageMarkup();render=bindScene(scene.querySelector('svg'));ready=true;if(reduced.matches)still();else play(false)}catch(e){if(ticket===serial)$('status').textContent='Tap Play animation to retry, or open the animated GIF below.'}}
for(const tab of document.querySelectorAll('.tab')){tab.onclick=()=>select(Number(tab.dataset.index));tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();select((style+(e.key==='ArrowRight'?1:2))%3);$('tab-'+style).focus()}}}
$('play').onclick=()=>play(true);$('pause').onclick=()=>{if(!ready)return;paused=!paused;if(paused){held=(performance.now()-epoch)%duration;cancelAnimationFrame(raf);$('pause').textContent='Resume'}else{epoch=performance.now()-held;$('pause').textContent='Pause';raf=requestAnimationFrame(tick)}};
reduced.addEventListener('change',()=>{manual=false;if(reduced.matches)still();else play(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);if(!paused)held=(performance.now()-epoch)%duration}else if(!paused){if(reduced.matches&&!manual)still();else{epoch=performance.now()-held;raf=requestAnimationFrame(tick)}}});select(style);load();
</script></body></html>
