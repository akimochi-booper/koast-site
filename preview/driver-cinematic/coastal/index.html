<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="koast-preview-version" content="coastal-player-20261029-v2"><title>Koast Driver · Coastal animation</title><link rel="canonical" href="https://koastride.com/preview/driver-cinematic/coastal/"><meta name="description" content="Animated preview of the Coastal Afterglow Koast Driver splash concept."><script src="/koast-acquisition.js?v=2" defer></script><style>*{box-sizing:border-box}html{background:#0b0d10;color:#eef4f1;font:15px system-ui,-apple-system,sans-serif}body{margin:0;padding:18px 14px calc(12px + env(safe-area-inset-bottom));min-height:100svh}header{text-align:center;max-width:600px;margin:auto}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#6cc8bb}h1{font-size:20px;font-weight:550;margin:7px 0 0}.frame{position:relative;overflow:hidden;width:min(100%,calc((100svh - 260px)*390/844));min-width:190px;aspect-ratio:390/844;margin:10px auto}.scene{position:absolute;width:390px;height:844px;transform-origin:0 0}.scene>svg{display:block}.controls{display:flex;justify-content:center;gap:8px;margin:9px auto}button{font:inherit;touch-action:manipulation;cursor:pointer;border:1px solid #35564b;border-radius:8px;padding:9px 15px;background:#12261f;color:#e1fff0;font-size:13px}button:focus-visible,a:focus-visible{outline:2px solid #8ae3cb;outline-offset:3px}.modes{margin-bottom:0}.modes button[aria-pressed=true]{background:#1b4b3d;border-color:#6cbea4;color:#effff7}.status{font-size:12px;line-height:1.5;text-align:center;color:#b5c9be;min-height:18px;margin:0 0 5px}.links{font-size:11px;text-align:center;color:#81988a}a{color:#a2daca;text-underline-offset:3px}.note{font-size:10px;color:#7d9389;text-align:center;margin-top:9px}@media(min-width:850px){.frame{width:min(390px,calc((100svh - 260px)*390/844))}}</style></head><body><header><div class="eyebrow">OPTION 3 · MOTION REFINEMENT</div><h1>Coastal Afterglow</h1></header><main><div class="frame" id="frame"><div class="scene" id="scene"></div></div><p class="status" id="status" aria-live="polite">Loading animation…</p><div class="controls modes" role="group" aria-label="Moving light style"><button id="mode-streak" aria-pressed="true">Light streak</button><button id="mode-dot" aria-pressed="false">Light dot</button></div><div class="controls"><button id="play">Play animation</button><button id="pause" disabled>Pause</button></div><div class="links"><a href="/preview/driver-cinematic/coastal/motion-streak-v2.gif">Open animated GIF</a> · <a href="/preview/driver-cinematic/">All three concepts</a></div><div class="note">Exploratory preview · Driver app unchanged</div></main><script type="module">
import {sample,stageMarkup,bindScene,duration} from './motion-v2.mjs';
const $=id=>document.getElementById(id),scene=$('scene'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let ready=false,render,raf=0,epoch=0,held=0,paused=true,manual=false,serial=0,mode='streak';
function fit(){scene.style.transform='scale('+($('frame').clientWidth/390)+')'}new ResizeObserver(fit).observe($('frame'));fit();
function draw(t,still=false){if(render)render(sample(t,still),mode)}
function tick(now){if(!paused)draw((now-epoch)%duration);if(!paused&&!document.hidden)raf=requestAnimationFrame(tick)}
function still(){cancelAnimationFrame(raf);paused=true;held=2200;draw(2200,true);$('pause').disabled=true;$('play').textContent='Play animation';$('status').textContent='Motion is paused by your device setting. Tap Play animation to preview.'}
function status(){return mode==='streak'?'Short directional light streak · crisp white tip, restrained teal tail.':'Compact light dot · less bloom, the same refined path.'}
function play(explicit=true){if(!ready){load();return;}manual=explicit;cancelAnimationFrame(raf);epoch=performance.now();paused=false;held=0;draw(0);$('pause').disabled=false;$('pause').textContent='Pause';$('play').textContent='Replay';$('status').textContent=status();raf=requestAnimationFrame(tick)}
function image(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=url})}
async function load(){const ticket=++serial;$('status').textContent='Loading animation…';try{await Promise.all(['../assets/coastal.jpg','../wordmark.svg','../assets/lightpoint.png'].map(image));if(ticket!==serial)return;scene.innerHTML=stageMarkup();render=bindScene(scene.querySelector('svg'));ready=true;if(reduced.matches)still();else play(false)}catch(e){if(ticket===serial)$('status').textContent='Tap Play animation to retry, or open the animated GIF below.'}}
function choose(next){mode=next;$('mode-streak').setAttribute('aria-pressed',String(mode==='streak'));$('mode-dot').setAttribute('aria-pressed',String(mode==='dot'));if(ready){if(reduced.matches&&!manual)still();else{draw(paused?held:(performance.now()-epoch)%duration);$('status').textContent=status();}}}
$('mode-streak').onclick=()=>choose('streak');$('mode-dot').onclick=()=>choose('dot');$('play').onclick=()=>play(true);$('pause').onclick=()=>{if(!ready)return;paused=!paused;if(paused){held=(performance.now()-epoch)%duration;cancelAnimationFrame(raf);$('pause').textContent='Resume'}else{epoch=performance.now()-held;$('pause').textContent='Pause';raf=requestAnimationFrame(tick)}};
reduced.addEventListener('change',()=>{manual=false;if(reduced.matches)still();else play(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);if(!paused)held=(performance.now()-epoch)%duration}else if(!paused){if(reduced.matches&&!manual)still();else{epoch=performance.now()-held;raf=requestAnimationFrame(tick)}}});load();
</script></body></html>
