<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="koast-preview-version" content="driver-cinematic-20261029-v1"><title>Koast Driver · New directions</title><link rel="canonical" href="https://koastride.com/preview/driver-cinematic/"><meta name="description" content="Three new exploratory animated Koast Driver splash directions."><script src="/koast-acquisition.js?v=2" defer></script><style>*{box-sizing:border-box}html{background:#0b0d10;color:#eef4f1;font:15px system-ui,-apple-system,sans-serif}body{margin:0;padding:18px 14px calc(14px + env(safe-area-inset-bottom));min-height:100svh}header{max-width:620px;margin:auto;text-align:center}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#67c5bb}h1{font-size:20px;font-weight:550;margin:7px 0 14px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}button{font:inherit;touch-action:manipulation;cursor:pointer}.tab,.control{border:1px solid #2d4541;border-radius:8px;padding:11px 4px;background:#121c1c;color:#b5c8c0;font-size:12px}.tab[aria-selected=true]{background:#12322e;color:#e1fff4;border-color:#50a38f}.frame{position:relative;overflow:hidden;width:min(100%,calc((100svh - 235px)*390/844));min-width:190px;aspect-ratio:390/844;margin:12px auto 8px}.scene{position:absolute;width:390px;height:844px;transform-origin:0 0}.scene>svg{display:block}.caption{max-width:600px;margin:auto;min-height:33px;text-align:center;color:#a9beb5;font-size:12px;line-height:1.5}.controls{display:flex;justify-content:center;gap:8px;margin:10px auto}.control{padding:8px 14px}.note{text-align:center;color:#7d9389;font-size:10px}button:focus-visible{outline:2px solid #8ae3cb;outline-offset:3px}@media(min-width:850px){.frame{width:min(390px,calc((100svh - 235px)*390/844))}}</style></head><body><header><div class="eyebrow">EXPLORATORY · NEW DIRECTIONS</div><h1>Koast Driver</h1><div class="tabs" role="tablist" aria-label="New concepts"><button class="tab" id="tab-0" data-index="0" role="tab" aria-controls="preview" aria-selected="true" tabindex="0">1 · Welcome</button><button class="tab" id="tab-1" data-index="1" role="tab" aria-controls="preview" aria-selected="false" tabindex="-1">2 · Tailored</button><button class="tab" id="tab-2" data-index="2" role="tab" aria-controls="preview" aria-selected="false" tabindex="-1">3 · Coastal</button></div></header><main><div class="frame" id="preview" role="tabpanel" aria-labelledby="tab-0"><div class="scene" id="scene"></div></div><p class="caption" id="caption">Loading motion artwork…</p><div class="controls"><button class="control" id="replay">Replay</button><button class="control" id="pause">Pause</button></div><div class="note">Concept artwork · Driver app unchanged</div></main><script type="module">
import {sample,stageMarkup,artFiles,captions,duration} from './motion.mjs';
const $=id=>document.getElementById(id),scene=$('scene'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let selected=0,epoch=0,paused=false,held=0,raf=0,svg,serial=0;
const decoded=new Map();function load(url){if(!decoded.has(url))decoded.set(url,new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=()=>{decoded.delete(url);reject(new Error("Artwork unavailable"))};image.src=url}));return decoded.get(url)}
function fit(){scene.style.transform='scale('+($('preview').clientWidth/390)+')'}new ResizeObserver(fit).observe($('preview'));fit();
function draw(time){if(svg)applyFrame(svg,sample(selected,time,reduced.matches))}function tick(now){if(!paused)draw((now-epoch)%duration);if(!paused&&!reduced.matches&&!document.hidden)raf=requestAnimationFrame(tick)}
function restart(){if(!svg)return;cancelAnimationFrame(raf);paused=false;held=0;epoch=performance.now();$('pause').disabled=reduced.matches;$('pause').textContent=reduced.matches?'Still preview':'Pause';draw(0);if(!reduced.matches&&!document.hidden)raf=requestAnimationFrame(tick)}
async function choose(index){const ticket=++serial;cancelAnimationFrame(raf);svg=null;scene.innerHTML='';selected=index;for(const tab of document.querySelectorAll('.tab')){const on=Number(tab.dataset.index)===index;tab.setAttribute('aria-selected',String(on));tab.tabIndex=on?0:-1}$('preview').setAttribute('aria-labelledby','tab-'+index);$('caption').textContent='Loading motion artwork…';try{await Promise.all([load(artFiles[index]),load('wordmark.svg'),load('assets/lightpoint.png')]);if(ticket!==serial)return;scene.innerHTML=stageMarkup(index);svg=scene.querySelector('svg');$('caption').textContent=captions[index];restart()}catch(e){if(ticket===serial)$('caption').textContent='The artwork could not load. Tap Replay to try again.'}}
for(const tab of document.querySelectorAll('.tab')){tab.onclick=()=>choose(Number(tab.dataset.index));tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();choose((selected+(e.key==='ArrowRight'?1:2))%3);$('tab-'+selected).focus()}}}
$('replay').onclick=()=>svg?restart():choose(selected);$('pause').onclick=()=>{if(!svg||reduced.matches)return;paused=!paused;$('pause').textContent=paused?'Play':'Pause';if(paused){held=(performance.now()-epoch)%duration;cancelAnimationFrame(raf)}else{epoch=performance.now()-held;raf=requestAnimationFrame(tick)}};document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden&&!paused)restart()});reduced.addEventListener('change',restart);choose(0);
</script></body></html>
