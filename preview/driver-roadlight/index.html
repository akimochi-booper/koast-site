</style></head><body><header><div class="eyebrow">EXPLORATORY · ROAD &amp; LIGHT</div><h1>Koast Driver</h1><div class="tabs" role="tablist" aria-label="Motion concepts"><button class="tab" role="tab" id="tab-0" aria-controls="preview" aria-selected="true" tabindex="0" data-index="0">1 · Refined Flow</button><button class="tab" role="tab" id="tab-1" aria-controls="preview" aria-selected="false" tabindex="-1" data-index="1">2 · On-Ramp</button><button class="tab" role="tab" id="tab-2" aria-controls="preview" aria-selected="false" tabindex="-1" data-index="2">3 · Interchange</button></div></header><main><div class="frame" id="preview" role="tabpanel" aria-labelledby="tab-0"><div class="scene" id="scene"></div></div><p class="caption" id="caption">The current road language, with a cleaner light pass and a quieter finish.</p><div class="controls"><button class="control" id="replay">Replay</button><button class="control" id="pause">Pause</button><button class="control" id="current" aria-pressed="false">Current style</button></div><div class="note">Preview only · Driver app unchanged</div></main><script type="module">
import {sample,stageMarkup,applyFrame,descriptions,duration} from './motion.mjs';
const $=id=>document.getElementById(id),scene=$('scene'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const [source]=await Promise.all([fetch('current-reference.txt').then(r=>{if(!r.ok)throw Error('Reference unavailable');return r.text()}),new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src='wordmark.svg'})]);
let selected=0,reference=false,epoch=0,paused=false,held=0,raf=0,svg;
const fit=()=>scene.style.transform='scale('+($('preview').clientWidth/390)+')';new ResizeObserver(fit).observe($('preview'));fit();
function draw(time){if(!reference)applyFrame(svg,sample(selected,time,reduced.matches))}
function tick(now){if(!paused)draw((now-epoch)%duration);if(!paused&&!reference&&!reduced.matches&&!document.hidden)raf=requestAnimationFrame(tick)}
function restart(){cancelAnimationFrame(raf);paused=false;held=0;epoch=performance.now();$('pause').disabled=reduced.matches;$('pause').textContent=reduced.matches?'Still preview':'Pause';scene.innerHTML=reference?source:stageMarkup(selected);svg=scene.querySelector('svg');if(!reference){draw(0);if(!reduced.matches&&!document.hidden)raf=requestAnimationFrame(tick)}}
function choose(index){selected=index;reference=false;$('current').setAttribute('aria-pressed','false');for(const tab of document.querySelectorAll('.tab')){const on=Number(tab.dataset.index)===index;tab.setAttribute('aria-selected',String(on));tab.tabIndex=on?0:-1}$('preview').setAttribute('aria-labelledby','tab-'+index);$('caption').textContent=descriptions[index];restart()}
for(const tab of document.querySelectorAll('.tab')){tab.onclick=()=>choose(Number(tab.dataset.index));tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();choose((selected+(e.key==='ArrowRight'?1:2))%3);$('tab-'+selected).focus()}}}
$('replay').onclick=restart;$('current').onclick=()=>{reference=!reference;$('current').setAttribute('aria-pressed',String(reference));$('caption').textContent=reference?'Current Driver splash — source reference for comparison.':descriptions[selected];restart()};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';if(reference){for(const e of scene.querySelectorAll('*'))e.style.animationPlayState=paused?'paused':'running';return;}if(paused){held=(performance.now()-epoch)%duration;cancelAnimationFrame(raf)}else{epoch=performance.now()-held;raf=requestAnimationFrame(tick)}};
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(document.hidden){for(const e of scene.querySelectorAll('*'))e.style.animationPlayState='paused'}else if(!paused)restart()});reduced.addEventListener('change',restart);restart();
</script></body></html>
