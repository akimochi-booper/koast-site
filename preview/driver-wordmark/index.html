import {sample,duration,descriptions} from './motion.mjs';
const $=id=>document.getElementById(id),content=$('content'),logo=$('logo'),field=$('field'),normal=$('normal'),label=$('label');

new ResizeObserver(fit).observe($('preview'));fit();
function draw(t){const s=sample(selected,t,reduced.matches);content.style.opacity=s.alpha;field.hidden=selected!==1;logo.hidden=selected===1;
 logo.style.left=s.x+'px';logo.style.top=s.y+'px';logo.style.width=s.w+'px';logo.style.opacity=s.opacity;
 logo.style.transform='perspective(500px) rotateZ('+s.angleZ+'deg) rotateY('+s.angleY+'deg)';logo.style.filter=s.blur>.01?'blur('+s.blur+'px)':'none';
 const mask='linear-gradient(165deg,#000 '+(s.edge-5)+'%,transparent '+(s.edge+5)+'%)';normal.style.maskImage=mask;normal.style.webkitMaskImage=mask;
 label.style.top=(s.captionY-11)+'px';label.style.opacity=s.caption;
}
function tick(now){if(!ready)return;if(!epoch)epoch=now;if(!paused)draw((now-epoch)%duration);if(!paused&&!reduced.matches&&!document.hidden)raf=requestAnimationFrame(tick)}
function restart(){cancelAnimationFrame(raf);epoch=performance.now();paused=false;pausedTime=0;$('pause').textContent=reduced.matches?'Still preview':'Pause';$('pause').disabled=reduced.matches;draw(0);if(ready&&!reduced.matches&&!document.hidden)raf=requestAnimationFrame(tick)}
function choose(index){selected=index;for(const tab of document.querySelectorAll('.tab')){const on=Number(tab.dataset.index)===index;tab.setAttribute('aria-selected',String(on));tab.tabIndex=on?0:-1}$('preview').setAttribute('aria-labelledby','tab-'+index);$('caption').textContent=descriptions[index];restart()}
for(const tab of document.querySelectorAll('.tab')){tab.onclick=()=>choose(Number(tab.dataset.index));tab.onkeydown=event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();choose((selected+(event.key==='ArrowRight'?1:3))%4);$('tab-'+selected).focus()}}}
$('replay').onclick=restart;$('pause').onclick=()=>{if(reduced.matches)return;paused=!paused;if(paused){pausedTime=(performance.now()-epoch)%duration;cancelAnimationFrame(raf);$('pause').textContent='Play'}else{epoch=performance.now()-pausedTime;$('pause').textContent='Pause';raf=requestAnimationFrame(tick)}};
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden){if(!paused)restart()}});reduced.addEventListener('change',restart);
