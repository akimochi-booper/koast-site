name: Validate website chat Worker
on:
  push:
    branches: [main]
    paths: ['workers/koast-chat/**', '.github/workflows/deploy-chat.yml']
  workflow_dispatch:
concurrency:
  group: validate-koast-chat
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website chat
        working-directory: workers/koast-chat
        run: |
          npm run check
          npm test
          npx --yes esbuild@0.25.0 worker.js --bundle --format=esm --outfile=/dev/null
