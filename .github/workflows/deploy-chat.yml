name: Deploy website chat Worker
on:
  push:
    branches: [main]
    paths: ['workers/koast-chat/**', '.github/workflows/deploy-chat.yml']
  workflow_dispatch:
concurrency:
  group: deploy-koast-chat
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website chat
        working-directory: workers/koast-chat
        run: |
          npm run check
          npm test
          npx --yes esbuild@0.25.0 worker.js --bundle --format=esm --outfile=/dev/null
      - name: Deploy website chat
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9481e14d6980f4de99bebe0097842362
          wranglerVersion: "4.151.1"
          workingDirectory: workers/koast-chat
          command: deploy
